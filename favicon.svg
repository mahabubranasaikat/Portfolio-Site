<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181920" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff453a" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ff3b30" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Squircle Background with Red Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#redGrad)" stroke-width="2.5" />

  <!-- Code Left Bracket < -->
  <path d="M22 20 L11 32 L22 44" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Center Slash / with Red Glow -->
  <path d="M37 17 L27 47" fill="none" stroke="#ff3b30" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Code Right Bracket > -->
  <path d="M42 20 L53 32 L42 44" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
