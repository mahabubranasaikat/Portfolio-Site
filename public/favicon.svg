<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181f" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff453a" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ff3b30" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Red Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Code Bracket Left < -->
  <path d="M19 24 L12 32 L19 40" fill="none" stroke="#ff3b30" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- Code Bracket Right > -->
  <path d="M45 24 L52 32 L45 40" fill="none" stroke="#ff3b30" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- Core Monogram S -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#glow)">S</text>

  <!-- Glowing Tech Accent Dot -->
  <circle cx="40" cy="22" r="2.5" fill="#ff3b30" filter="url(#glow)" />
</svg>
